version: 1
disable_existing_loggers: false
filters:
  request_id:
    (): codeknowledge.utils.logging.RequestIdFilter
formatters:
  standard:
    format: "%(asctime)s %(levelname)-5s %(name)s [request_id=%(request_id)s] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    filters: [request_id]
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filters: [request_id]
    filename: ./logs/codeknowledge.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
root:
  level: INFO
  handlers: [console, file]
