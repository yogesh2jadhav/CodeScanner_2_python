application:
  name: CodeKnowledgeAI
  version: 0.1.0
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

okf:
  # Java2OKF output folder (the one containing index.md). Windows: 'C:\path\to\output' in single quotes.
  source_dir: ./data/okf
  # Frontmatter keys every document must carry (validator reports missing ones).
  required_metadata: [id, type]

vector:
  provider: chroma
  persist_directory: ./data/indexes/vector
  collection_name: codeknowledge
  top_k: 10

graph:
  provider: networkx
  persist_directory: ./data/indexes/graph

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:8b
  temperature: 0.1
  # Explaining a long method on a CPU-only machine can take several minutes.
  timeout_seconds: 600
  # Context window passed to Ollama (its default truncates long prompts silently).
  num_ctx: 16384

source:
  # Root folder of the Java project that Java2OKF analysed (its project.sourceRoot).
  # With it, answers include the method's real code and developer comments.
  # Windows example: root_dir: 'C:\Users\me\projects\my-java-app'
  root_dir: null
  max_lines: 800

embedding:
  provider: ollama
  base_url: http://localhost:11434
  model: nomic-embed-text
  # Per-request timeout. CPU-only machines are slow; timed-out batches are split and retried.
  timeout_seconds: 300
  batch_size: 16

# Evidence-grounded "Explain method" (POST /api/methods/{id}/explain, Explain tab in the entity panel).
method_explanation:
  enabled: true
  default_detail: detailed          # detailed | summary
  max_callee_depth: 1               # 0 = selected method only
  max_callees_per_method: 8         # callee bodies included per method (non-accessors first)
  max_evidence_documents: 30
  max_source_lines_per_method: 2500 # larger bodies are refused with a size-limit warning
  max_context_tokens: 12000         # effective = min(this, llm.num_ctx - output_token_reserve)
  output_token_reserve: 2500
  chars_per_token: 3.5
  include_caller_context: false
  include_related_config: true      # referenced constants of the declaring class
  include_sql_evidence: true        # SQL-looking string literals in the method/callees
  validate_citations: true
  max_repair_attempts: 1
  cache_enabled: true
  prompt_version: method-explanation-v1
  debug_prompt_logging: false       # true logs a truncated prompt at DEBUG (may contain source)

retrieval:
  semantic_top_k: 10
  symbol_top_k: 10
  graph_max_depth: 3
  max_context_documents: 20
  max_context_tokens: 12000
  classifier_confidence_threshold: 0.6

cache:
  enabled: true
  directory: ./data/cache
  ttl_seconds: 86400

logging:
  level: INFO
  file: ./logs/codeknowledge.log
  config_file: ./config/logging.yaml
