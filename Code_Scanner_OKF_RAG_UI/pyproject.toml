[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeknowledge"
version = "0.1.0"
description = "Code_Scanner_OKF_RAG_UI (CodeKnowledgeAI): OKF + Graph + RAG for Java code understanding"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "httpx>=0.27",
  "chromadb>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
codeknowledge = "codeknowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not llm'"
markers = [
  "llm: requires a running Ollama instance (run with: pytest -m llm)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with:Warning"]
